  <body>

        </ul>

        <!-- Hamburger — visible on mobile only, controlled by JS -->

          class="nav__hamburger"
          id="js-hamburger"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="js-mobile-menu"
        >

          <span class="nav__hamburger-line"></span>
          <span class="nav__hamburger-line"></span>
        </button>
      </div>
      <!-- /nav__bar -->

        <li><a href="index.html" class="nav__link--active">Galería</a></li>

    <!-- ═══════════════════════════════════════════════════════════════
       HERO
       ═══════════════════════════════════════════════════════════════ -->
    <header class="site-hero">
      <!-- ↓ EDIT: Your gallery category / series name -->
      <p class="hero__tag" id="js-hero-tag">Samsung · S23 Ultra</p>

      <!-- ↓ EDIT: Your gallery headline -->
      <h1 class="hero__title" id="js-hero-title">
        Rutas &amp;<br /><strong>Ciudades</strong>
      </h1>

      <div class="hero__meta">
        <!-- ↓ EDIT: Update the photo count to match your gallery -->
        <span class="hero__count" id="js-photo-count">57 Fotos</span>
        <div class="hero__rule" aria-hidden="true"></div>
        <!-- ↓ EDIT: A one-line description of your gallery series -->
        <p class="hero__desc" id="js-hero-desc">Argentina, Chile, Brasil</p>
      </div>
    </header>

    <!-- ═══════════════════════════════════════════════════════════════
       FILTER BAR  (optional — delete this section if not needed)
       ═══════════════════════════════════════════════════════════════ -->
    <div class="gallery-filter-wrap">
      <div
        class="gallery-filter"
        id="js-filter"
        role="toolbar"
        aria-label="Filter gallery"
      >
        <!-- Los botones se inyectan desde photos.json por js/gallery.js -->
      </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
       MASONRY GALLERY
       ─────────────────────────────────────────────────────────────
       HOW TO ADD PHOTOS:
       1. Copy one <div class="gallery__item"> block below.
       2. Replace the src="..." with your image path.
       3. Replace data-full="..." with a high-res path for the lightbox.
       4. Update data-title and data-meta to your caption text.
       5. Set data-category to one of your filter names (e.g. "portrait").
       ─────────────────────────────────────────────────────────────
       NOTE: The CSS column masonry needs images of VARYING heights
       for the best visual result. Mix portrait & landscape shots.
       ═══════════════════════════════════════════════════════════════ -->
    <main class="gallery" id="js-gallery" aria-label="Photo gallery">
      <!-- Los items se inyectan desde photos.json por js/gallery.js -->
    </main>
    <!-- /GALLERY -->

    <!-- ═══════════════════════════════════════════════════════════════
       LIGHTBOX  —  "Lightroom Mode"
       This element is controlled by JavaScript below.
       You do not need to edit this HTML.
       ═══════════════════════════════════════════════════════════════ -->
    <div
      class="lightbox"
      id="js-lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Photo viewer"
    >
      <div class="lightbox__bar">
        <span
          class="lightbox__counter"
          id="js-lb-counter"
          aria-live="polite"
        ></span>
        <button
          class="lightbox__close"
          id="js-lb-close"
          aria-label="Close photo viewer"
        >
          <svg
            viewBox="0 0 24 24"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="lightbox__stage">
        <button
          class="lightbox__nav lightbox__nav--prev"
          id="js-lb-prev"
          aria-label="Previous photo"
        >
          <svg
            viewBox="0 0 24 24"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>

        <!-- ↓ The <img> src is swapped by JS — do not edit src here -->
        <img src="" alt="" class="lightbox__image" id="js-lb-image" />

        <button
          class="lightbox__nav lightbox__nav--next"
          id="js-lb-next"
          aria-label="Next photo"
        >
          <svg
            viewBox="0 0 24 24"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 18l6-6-6-6" />
          </svg>
        </button>
      </div>

      <div class="lightbox__caption">
        <p class="lightbox__caption-title" id="js-lb-title"></p>
        <p class="lightbox__caption-meta" id="js-lb-meta"></p>
      </div>
    </div>
    <!-- /LIGHTBOX -->
